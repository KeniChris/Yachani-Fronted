<div class="heading">
  <div>
    <h1 class="page-title">Temas del grupo</h1>
    <p>Organiza los recursos por lo que están estudiando.</p>
  </div>
  <a mat-flat-button routerLink="crear">Crear tema</a>
</div>
<p class="helper-text count">3 de 30 temas</p>
<div class="topics">
  @for (tema of temas; track tema.idTema) {
    <mat-card
      ><div class="row">
        <mat-icon fontSet="material-symbols-rounded">folder</mat-icon>
        <h2 class="grow">{{ tema.nombre }}</h2>
        <a mat-icon-button [routerLink]="tema.editar" [attr.aria-label]="'Editar ' + tema.nombre"
          ><mat-icon fontSet="material-symbols-rounded">edit</mat-icon></a
        >
      </div>
      <p class="muted">{{ tema.descripcion }}</p>
      <a mat-stroked-button [routerLink]="tema.materiales">Ver materiales</a></mat-card
    >
  }
</div>
