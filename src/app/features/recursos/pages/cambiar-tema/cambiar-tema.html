<mat-card class="form-card"
  ><div class="heading row">
    <h1>Cambiar tema</h1>
    <a mat-icon-button [routerLink]="material.detalle" aria-label="Cerrar cambio de tema"
      ><mat-icon fontSet="material-symbols-rounded">close</mat-icon></a
    >
  </div>
  <p class="muted">{{ material.nombre }}</p>
  <form [formGroup]="formulario">
    <mat-form-field appearance="outline"
      ><mat-label>Tema</mat-label
      ><mat-select formControlName="idTema"
        ><mat-option value="sin-tema">Sin tema</mat-option
        ><mat-option value="1">Límites y continuidad</mat-option
        ><mat-option value="2">Reglas de derivación</mat-option
        ><mat-option value="3">Aplicaciones de la derivada</mat-option></mat-select
      ><mat-hint>Elige un tema del grupo o “Sin tema”.</mat-hint
      ><mat-error>Selecciona un tema o “Sin tema”.</mat-error></mat-form-field
    >
    <div class="actions">
      <a mat-stroked-button [routerLink]="material.detalle">Cancelar</a
      ><button
        mat-flat-button
        type="button"
        [disabled]="formulario.invalid"
        [routerLink]="material.detalle"
      >
        Guardar cambios
      </button>
    </div>
  </form></mat-card
>
