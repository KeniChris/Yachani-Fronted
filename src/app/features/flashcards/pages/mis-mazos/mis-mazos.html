<div class="heading">
  <div>
    <h1 class="page-title">Mis mazos</h1>
    <p>Tus borradores y mazos publicados, siempre en un mismo lugar.</p>
  </div>
  <a mat-flat-button routerLink="/app/flashcards/crear">Crear mazo</a>
</div>
<div class="deck-grid">
  @for (mazo of mazos; track mazo.idMazo) {
    <mat-card
      ><div class="deck-strip">
        <mat-icon fontSet="material-symbols-rounded">style</mat-icon
        ><span>{{ mazo.cantidad }}</span>
      </div>
      <h2>{{ mazo.titulo }}</h2>
      <p class="muted">{{ mazo.descripcion }}</p>
      <p class="helper-text">Leicy Cahuana · {{ mazo.estado }}</p>
      <p class="helper-text">{{ mazo.progreso }}</p>
      <mat-progress-bar
        mode="determinate"
        [value]="mazo.porcentaje"
        [attr.aria-label]="mazo.progreso"
      />
      @if (mazo.disponible) {
        <a mat-stroked-button routerLink="/app/flashcards/1">Ver mazo</a>
      } @else {
        <button mat-stroked-button disabled>Ver mazo</button>
      }
    </mat-card>
  }
</div>
