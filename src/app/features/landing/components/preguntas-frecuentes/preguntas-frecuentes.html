<section
  id="preguntas-frecuentes"
  class="preguntas-frecuentes"
  aria-labelledby="titulo-preguntas"
>
  <div class="contenedor">
    <div class="encabezado">
      <div>
        <span class="etiqueta-seccion">Centro de ayuda</span>

        <h2 id="titulo-preguntas">
          Preguntas <span>frecuentes</span>
        </h2>

        <p class="descripcion">
          Resolvemos las dudas más comunes para que puedas aprovechar
          Yachani y encontrar tu grupo de estudio ideal.
        </p>
      </div>

      <a class="enlace-ayuda" href="#contacto">
        ¿Necesitas más ayuda?
      </a>
    </div>

    <mat-accordion class="lista-preguntas">
      @for (pregunta of preguntas; track pregunta.titulo) {
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              {{ pregunta.titulo }}
            </mat-panel-title>
          </mat-expansion-panel-header>

          <p class="respuesta">{{ pregunta.respuesta }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</section>
