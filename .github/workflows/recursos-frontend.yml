name: Frontend
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Probar contratos e interacciones
        shell: bash
        run: |
          npm start -- --host 127.0.0.1 --port 4201 > test-server.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor" 2>/dev/null || true' EXIT
          for intento in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4201/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integracion
          npm run test:landing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-recursos-frontend
          path: |
            test-results/
            test-server.log
